<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D91A1A" />
      <stop offset="50%" stop-color="#E340D8" />
      <stop offset="100%" stop-color="#4851FF" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E0E0E0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect x="32" y="32" width="448" height="448" rx="110" fill="#0D0C0C" stroke="url(#bgGrad)" stroke-width="16" />
  <rect x="48" y="48" width="416" height="416" rx="94" fill="url(#bgGrad)" opacity="0.15" />

  <!-- Monogram Logo 'J' -->
  <path d="M 290 140 L 290 320 C 290 375 250 410 190 410 C 145 410 115 385 105 345 L 165 330 C 170 350 182 360 195 360 C 215 360 230 345 230 315 L 230 140 Z" fill="url(#textGrad)" filter="url(#glow)" />
  
  <!-- Accent Sparkle Dot -->
  <circle cx="340" cy="150" r="24" fill="url(#bgGrad)" />
</svg>
